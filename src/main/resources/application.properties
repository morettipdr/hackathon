## SIMULACAO (env-driven with safe defaults)
quarkus.datasource.db-kind=${SIM_DB_KIND:h2}
quarkus.datasource.jdbc.url=${SIM_JDBC_URL:jdbc:h2:mem:default;DB_CLOSE_DELAY=-1}
quarkus.datasource.username=${SIM_DB_USERNAME:}
quarkus.datasource.password=${SIM_DB_PASSWORD:sa}
quarkus.hibernate-orm.packages=${SIM_HIBERNATE_PACKAGES:org.caixa.model.entity.loan}
quarkus.hibernate-orm.schema-management.strategy=${SIM_SCHEMA_STRATEGY:drop-and-create}

## PRODUTO (env-driven with defaults)
quarkus.datasource.product.db-kind=${PRODUCT_DB_KIND:mssql}
quarkus.datasource.product.jdbc.url=${PRODUCT_JDBC_URL:jdbc:sqlserver://dbhackathon.database.windows.net:1433;databaseName=hack}
quarkus.datasource.product.username=${PRODUCT_DB_USERNAME:hack}
quarkus.datasource.product.password=${PRODUCT_DB_PASSWORD:Password23}
quarkus.hibernate-orm."product".datasource=product
quarkus.hibernate-orm."product".packages=${PRODUCT_HIBERNATE_PACKAGES:org.caixa.model.entity.product}
quarkus.hibernate-orm."product".database.default-schema=${PRODUCT_DB_SCHEMA:dbo}

## Azure Event Hubs (use Secret for the connection string)
eventhub.connection.string=${EVENTHUB_CONNECTION_STRING}
eventhub.name=${EVENTHUB_NAME:simulacoes}

## Misc
quarkus.hibernate-orm.log.sql=${ORM_LOG_SQL:true}
quarkus.hibernate-orm.log.format-sql=${ORM_LOG_FORMAT_SQL:true}
quarkus.devservices.enabled=${QUARKUS_DEVservices_ENABLED:false}
quarkus.datasource.devservices.enabled=${QUARKUS_DS_DEVservices_ENABLED:false}
quarkus.default-locale=${DEFAULT_LOCALE:pt-BR}